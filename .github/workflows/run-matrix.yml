name: Test servers
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    types:
      - closed
      - opened
      - synchronize
      - reopened

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        version:
          - { mc: 1.21.1, java: 21 }
          - { mc: 26.3, java: 25 }
        type:
          - vanilla
          - paper
          - forge
          - neoforge
          - fabric
    name: ${{ matrix.type }} ${{ matrix.version.mc }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin
      - name: Run server
        timeout-minutes: 10
        uses: ./
        with:
          mc: ${{ matrix.version.mc }}
          modloader: ${{ matrix.type }}
          java: ${{ matrix.version.java }}

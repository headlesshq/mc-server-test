name: MC-Server-Test
description: Test Minecraft production servers inside your CI
author: HeadlessHQ
branding:
  icon: play
  color: red

inputs:
  mc:
    description: Minecraft version to run
    required: true
  modloader:
    description: Modloader to install (paper, fabric, vanilla, forge, neoforge)
    required: true
  java:
    description: Java version to use (8, 16, 17, 21, 25)
    required: true
  headlessmc-command:
    description: Command-line arguments for HeadlessMC
    default: ''
  fabric-api:
    description: Fabric API version to download (e.g. 0.97.0) or none
    default: "none"
  fabric-gametest-api:
    description: Fabric GameTest API version (e.g. 1.3.5+85d85a934f) or none
    default: "none"
  download-hmc:
    description: Download HeadlessMC (if false, headlessmc.jar must be in the working directory)
    default: "true"
  hmc-version:
    description: HeadlessMC version
    default: "3.0.0-RC5"
  cache-mc:
    description: Cache .minecraft
    default: "true"
  test-file:
    description: Json file for HeadlessMc command tests
    default: "none"

runs:
  using: composite
  steps:
    - name: Bootstrap HeadlessMC
      run: |
        # Java/HeadlessMc need native paths, on Windows convert Git Bash paths to C:/... form
        native() { if command -v cygpath >/dev/null 2>&1; then cygpath -m "$1"; else echo "$1"; fi; }
        mkdir -p HeadlessMC run/mods
        if [ -s HeadlessMC/config.properties ] && [ -n "$(tail -c1 HeadlessMC/config.properties)" ]; then
          echo >> HeadlessMC/config.properties
        fi
        cat <<EOF >> HeadlessMC/config.properties
        hmc.java.versions=$(native "$JAVA_HOME")
        hmc.files.mc=$(native "$HOME/.minecraft")
        hmc.jline.enabled=false
        hmc.launcher.crash-report-watcher=true
        EOF
        echo "HMC_FILES_LOCATION=$(native "$PWD/HeadlessMC")" >> "$GITHUB_ENV"
      shell: bash

    - if: inputs.test-file == 'none'
      name: Configure HeadlessMc to use no Test file
      run: echo hmc.test.server=true >> HeadlessMC/config.properties
      shell: bash

    - if: inputs.test-file != 'none'
      name: Configure HeadlessMc to use a Test file
      run: echo hmc.test.file=${{ inputs.test-file }} >> HeadlessMC/config.properties
      shell: bash

    - name: Remember Java
      run: echo "MCST_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      shell: bash

    - id: hmc-java
      name: Setup Java 25 for HeadlessMC
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: 25
        distribution: temurin

    - name: Restore Java
      run: |
        echo "HMC_JAVA=${{ steps.hmc-java.outputs.path }}/bin/java" >> "$GITHUB_ENV"
        if [ -n "$MCST_JAVA_HOME" ]; then
          echo "JAVA_HOME=$MCST_JAVA_HOME" >> "$GITHUB_ENV"
          echo "$MCST_JAVA_HOME/bin" >> "$GITHUB_PATH"
        fi
      shell: bash

    - if: inputs.download-hmc == 'true'
      name: Get HeadlessMC
      uses: robinraju/release-downloader@a96f54c1b5f5e09e47d9504526e96febd949d4c2 # v1.11
      with:
        repository: headlesshq/headlessmc
        tag: ${{ inputs.hmc-version }}
        fileName: headlessmc.jar

    - if: inputs.cache-mc == 'true'
      name: Cache Minecraft
      uses: actions/cache@v4
      with:
        path: ~/.minecraft
        key: ${{ runner.os }}-${{ inputs.mc }}-${{ inputs.modloader }}-hmc

    - name: Download ${{ inputs.modloader }}-${{ inputs.mc }}
      run: |
        "$HMC_JAVA" -jar headlessmc.jar server add --force --name mc-server-test --dir run ${{ inputs.modloader }} ${{ inputs.mc }}
      shell: bash

    - if: inputs.fabric-api != 'none'
      name: Download fabric-api v${{ inputs.fabric-api }}
      run: >
        curl -fL --create-dirs -o run/mods/fabric-api-${{ inputs.fabric-api }}+${{ inputs.mc }}.jar
        https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ inputs.fabric-api }}+${{ inputs.mc }}/fabric-api-${{ inputs.fabric-api }}+${{ inputs.mc }}.jar
      shell: bash

    - if: inputs.fabric-gametest-api != 'none'
      name: Download fabric-gametest-api v${{ inputs.fabric-gametest-api }}
      run: >
        curl -fL --create-dirs -o run/mods/fabric-gametest-api-v1-${{ inputs.fabric-gametest-api }}.jar
        https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-gametest-api-v1/${{ inputs.fabric-gametest-api }}/fabric-gametest-api-v1-${{ inputs.fabric-gametest-api }}.jar
      shell: bash

    - name: Run server
      run: |
        "$HMC_JAVA" -jar headlessmc.jar server launch -eula ${{ inputs.headlessmc-command }} mc-server-test
      shell: bash
